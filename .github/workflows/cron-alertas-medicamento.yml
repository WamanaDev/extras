name: Cron — alertas de medicamento

# Substitui o Vercel Cron pra esse job específico: o plano Hobby só permite
# 1 execução/dia por cron, mas FUND-005 exige alerta de dose atrasada em até
# 5 min do horário previsto. GET /api/cron/alertas-medicamento já se
# autentica sozinha (CRON_SECRET, ver src/server/http/cron-auth.ts) — este
# workflow só dispara a chamada, não roda nenhum código do app.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Chamar /api/cron/alertas-medicamento
        run: |
          status=$(curl -s -o /tmp/resposta.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.APP_BASE_URL }}/api/cron/alertas-medicamento")
          echo "HTTP $status"
          cat /tmp/resposta.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Falhou com status $status"
            exit 1
          fi
